name: Docker Deploy (Self-Hosted)

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

concurrency:
  group: deploy-baserow-cc
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    env:
      DEPLOY_DIR: /home/runner/deploy/baserow-cc
      COMPOSE_FILE: deploy/all-in-one/docker-compose.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify docker access
        run: |
          docker version
          docker-compose version

      - name: Prepare deploy directory
        run: |
          mkdir -p "$DEPLOY_DIR"
          find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
          tar --exclude='.git' -cf - . | tar -xf - -C "$DEPLOY_DIR"

      - name: Prepare .env
        env:
          BASEROW_ENV_FILE: ${{ secrets.BASEROW_ENV_FILE }}
        run: |
          cd "$DEPLOY_DIR"
          if [ -n "$BASEROW_ENV_FILE" ]; then
            printf '%s' "$BASEROW_ENV_FILE" > .env
            echo "Using .env from secret BASEROW_ENV_FILE"
          elif [ ! -f .env ]; then
            cp .env.example .env
            echo "No BASEROW_ENV_FILE secret found, copied .env.example to .env"
          else
            echo "Using existing .env"
          fi

      - name: Build images
        run: |
          cd "$DEPLOY_DIR"
          docker-compose -f "$COMPOSE_FILE" build \
            --build-arg HTTP_PROXY="$HTTP_PROXY" \
            --build-arg HTTPS_PROXY="$HTTPS_PROXY" \
            --build-arg NO_PROXY="$NO_PROXY" \
            --build-arg http_proxy="$http_proxy" \
            --build-arg https_proxy="$https_proxy" \
            --build-arg no_proxy="$no_proxy"

      - name: Start containers
        run: |
          cd "$DEPLOY_DIR"
          docker-compose -f "$COMPOSE_FILE" up -d --remove-orphans

      - name: Show running containers
        run: |
          cd "$DEPLOY_DIR"
          docker-compose -f "$COMPOSE_FILE" ps

      - name: Cleanup unused images
        if: always()
        run: docker image prune -f
